server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unmatched path falls back to index.html so
    # client-side routing (and a hard refresh on a deep link) still works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
